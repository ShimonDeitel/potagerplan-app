name: Potagerplan
options:
  bundleIdPrefix: com.shimondeitel.potagerplan
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  groupSortPosition: top
settings:
  base:
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "5.0"
    DEVELOPMENT_TEAM: "W7Q885Q59C"
    CODE_SIGN_STYLE: Automatic
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    TARGETED_DEVICE_FAMILY: "1"
    ENABLE_USER_SCRIPT_SANDBOXING: "YES"
targets:
  Potagerplan:
    type: application
    platform: iOS
    sources:
      - path: Potagerplan
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.shimondeitel.potagerplan
        TARGETED_DEVICE_FAMILY: "1"
        INFOPLIST_FILE: Potagerplan/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        ENABLE_PREVIEWS: "YES"
        GENERATE_INFOPLIST_FILE: "NO"
  PotagerplanTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: PotagerplanTests
      - path: Potagerplan.storekit
    dependencies:
      - target: Potagerplan
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.shimondeitel.potagerplan.tests
        GENERATE_INFOPLIST_FILE: "YES"
        TARGETED_DEVICE_FAMILY: "1"
  PotagerplanUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: PotagerplanUITests
    dependencies:
      - target: Potagerplan
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.shimondeitel.potagerplan.uitests
        GENERATE_INFOPLIST_FILE: "YES"
        TARGETED_DEVICE_FAMILY: "1"
schemes:
  Potagerplan:
    build:
      targets:
        Potagerplan: all
        PotagerplanTests: [test]
        PotagerplanUITests: [test]
    run:
      config: Debug
      storeKitConfiguration: Potagerplan.storekit
    test:
      config: Debug
      storeKitConfiguration: Potagerplan.storekit
      targets:
        - PotagerplanTests
        - PotagerplanUITests
    archive:
      config: Release
